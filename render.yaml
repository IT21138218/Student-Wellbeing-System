# Render Blueprint: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: student-wellbeing-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free            # ML libraries are memory hungry; use "starter" if it runs out of RAM
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: student_wellbeing
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
